name: Update news digest
on:
  schedule:
    - cron: "0 * * * *"   # هر ساعت اجرا می‌شود
  workflow_dispatch: {}    # اجرای دستی
permissions:
  contents: write          # اجازه ذخیره نتیجه
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Commit changes
        run: |
          git config user.name "news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/index.html
          git diff --staged --quiet || (git commit -m "Update news" && git push)
